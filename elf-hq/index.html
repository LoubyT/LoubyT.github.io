<!doctype html>
<html lang="en" class="needs-pin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#E8F2E5">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Elf HQ, a sample Christmas storybook. Your own chapters stay off this public site.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://fd-refresh-relay.vercel.app https://elf-hq-room.louby-trahan.workers.dev wss://elf-hq-room.louby-trahan.workers.dev; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Elf HQ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Elf HQ</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
  <a class="skip" href="#page">Skip to the story</a>
  <div class="stage" aria-hidden="true">
    <div class="stars"></div>
    <div class="lamp-pool"></div>
    </div>
  <div class="snow" aria-hidden="true"></div>

  <div class="book" id="book" hidden>
    <div class="topbar">
      <svg class="garland" viewBox="0 0 400 18" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 3 Q 40 12 80 4 T 160 5 T 240 3 T 320 6 T 400 3" fill="none" stroke="#1e5a40" stroke-width="1.25"/>
        <circle cx="40" cy="8" r="2.2" fill="#c43b55"/><circle cx="120" cy="7" r="2.2" fill="#e3b15a"/><circle cx="200" cy="6" r="2.2" fill="#c43b55"/><circle cx="280" cy="8" r="2.2" fill="#e3b15a"/><circle cx="360" cy="6" r="2.2" fill="#c43b55"/>
      </svg>
      <header class="mast">
        <div class="wordmark">
          <p class="eyebrow" id="eyebrow">The Holly House</p>
          <div class="wordmark-row">
            <h1 id="title">Elf HQ</h1>
            <span class="sync-dot" id="syncDot" role="status" data-state="idle" aria-label="Only on this phone" title="Only on this phone"></span>
          </div>
        </div>
        <div class="mast-side">
          <div class="tools">
            <button type="button" class="icon-btn sound" id="soundBtn" data-act="sound" aria-pressed="false" aria-label="Sound off" title="Sound off">
              <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M3.6 9.1h3.2L11 5.2v13.6l-4.2-3.9H3.6a1 1 0 0 1-1-1v-3.8a1 1 0 0 1 1-1z"/>
                <path d="M15.2 9.1l5.4 5.8M20.6 9.1l-5.4 5.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path fill="currentColor" d="M3.6 9.1h3.2L11 5.2v13.6l-4.2-3.9H3.6a1 1 0 0 1-1-1v-3.8a1 1 0 0 1 1-1z"/>
                <path d="M14.6 9.1a3.6 3.6 0 0 1 0 5.8M17.4 6.6a7 7 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <a class="icon-btn settings" href="#settings" aria-label="Settings" title="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M19.4 13.1a7.7 7.7 0 0 0 .1-1.1 7.7 7.7 0 0 0-.1-1.1l2-1.6a.6.6 0 0 0 .1-.7l-1.9-3.3a.6.6 0 0 0-.7-.3l-2.4 1a7.4 7.4 0 0 0-1.9-1.1l-.4-2.5a.6.6 0 0 0-.6-.5h-3.8a.6.6 0 0 0-.6.5l-.4 2.5a7.4 7.4 0 0 0-1.9 1.1l-2.4-1a.6.6 0 0 0-.7.3L2.4 8.6a.6.6 0 0 0 .1.7l2 1.6a7.7 7.7 0 0 0-.1 1.1c0 .4 0 .7.1 1.1l-2 1.6a.6.6 0 0 0-.1.7l1.9 3.3c.1.3.5.4.8.3l2.4-1c.6.4 1.2.8 1.9 1.1l.4 2.5c.1.3.3.5.6.5h3.8c.3 0 .5-.2.6-.5l.4-2.5c.7-.3 1.3-.7 1.9-1.1l2.4 1c.3.1.6 0 .8-.3l1.9-3.3a.6.6 0 0 0-.1-.7l-2-1.6zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
              </svg>
            </a>
          </div>
        </div>
      </header>
      <nav class="nav" id="nav" aria-label="Elf HQ">
        <a href="#today" data-tab="today"><span class="word">Today</span></a>
        <a href="#story" data-tab="story"><span class="word">Story</span></a>
        <a href="#crafts" data-tab="crafts"><span class="word">Crafts</span></a>
        <a href="#shopping" data-tab="shopping"><span class="word">Shopping</span></a>
        <a href="#gifts" data-tab="gifts"><span class="word">Gifts</span></a>
      </nav>
    </div>
    <div class="banners" id="banners"></div>
    <main class="page" id="page" tabindex="-1">
      <p class="boot" id="boot">Lighting the lamp…</p>
    </main>
  </div>

  <div class="sheet-layer" id="sheetLayer" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-bar">
        <button type="button" class="btn ghost" id="closeSheet" data-act="close-sheet">Close</button>
        <button type="button" class="btn ghost chapter-prev" data-act="chapter-prev" aria-label="Previous chapter">‹</button>
        <h2 id="sheetTitle">Page</h2>
        <p class="day-count" id="dayCount"></p>
        <button type="button" class="btn ghost chapter-next" data-act="chapter-next" aria-label="Next chapter">›</button>
      </div>
      <div id="conflictSlot"></div>
      <div class="sheet-body" id="sheetBody" data-swipe="chapters"></div>
    </div>
  </div>

  <div class="sheet-layer" id="giftLayer" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="giftTitle">
      <div class="sheet-bar">
        <button type="button" class="btn ghost" data-act="gift-close">Close</button>
        <h2 id="giftTitle">Add gift</h2>
        <button type="button" class="btn" data-act="gift-save">Save</button>
      </div>
      <div class="sheet-body" id="giftBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden>
    <p id="toastText"></p>
    <div class="toast-actions" id="toastActions"></div>
  </div>
  <div class="update" id="updateBar" hidden>
    <p>A new version of the desk is ready. Your notebook stays on this browser.</p>
    <button type="button" class="btn" id="updateBtn" data-act="update">Update</button>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
  <p id="filmTrace" hidden></p>
  <noscript>
    <p class="boot">Elf HQ needs JavaScript to turn the pages. Nothing is sent anywhere.</p>
  </noscript>
  <script src="live-config.js?v=23"></script>
  <script src="pin-screen.js?v=23"></script>
  <script src="plan-model.js?v=23"></script>
  <script src="demo-plan.js?v=23"></script>
  <script src="media-manifest.js?v=23"></script>
  <script src="media-fit.js?v=23"></script>
  <script src="sync-engine.js?v=23"></script>
  <script src="scene-art.js?v=23"></script>
  <script src="sync-port.js?v=23"></script>
  <script src="monitor-contract.js?v=23"></script>
  <script src="gifts.js?v=23"></script>
  <script src="media-vault.js?v=23"></script>
  <script src="scratchpad.js?v=23"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
